<footer class="portal-footer mt-auto">
  <div class="portal-footer__accent" aria-hidden="true"></div>
  <div class="portal-footer__inner">
    <div class="portal-footer__brand">
      <div class="portal-footer__logo {% if brand.has_logo %}has-image{% endif %}">
        {% if brand.has_logo %}
        <img src="{{ brand.logo_url }}" alt="" width="36" height="36" decoding="async">
        {% else %}
        <span>{{ brand.brand_initials }}</span>
        {% endif %}
      </div>
      <div class="min-w-0">
        <p class="portal-footer__name">{{ brand.school_display }}</p>
        <p class="portal-footer__tagline">
          {% if brand.motto %}
            “{{ brand.motto }}”
          {% else %}
            Parent &amp; student portal · Powered by Educentric
          {% endif %}
        </p>
      </div>
    </div>

    <nav class="portal-footer__links" aria-label="Footer">
      <a href="{% url 'portal:dashboard' %}" class="portal-footer__link">
        <span class="portal-footer__link-icon portal-footer__link-icon--brand" aria-hidden="true">
          <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l9-8 9 8M5 10v9h5v-5h4v5h5v-9"/></svg>
        </span>
        Home
      </a>
      <a href="{% url 'portal:profile_settings' %}" class="portal-footer__link">
        <span class="portal-footer__link-icon portal-footer__link-icon--sky" aria-hidden="true">
          <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        </span>
        Profile
      </a>
      <a href="{% url 'portal:academic_calendar' %}" class="portal-footer__link">
        <span class="portal-footer__link-icon portal-footer__link-icon--amber" aria-hidden="true">
          <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3M4 11h16M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
        </span>
        Calendar
      </a>
      <form method="post" action="{% url 'portal:logout' %}" class="inline">
        {% csrf_token %}
        <button type="submit" class="portal-footer__link portal-footer__link--danger">
          <span class="portal-footer__link-icon portal-footer__link-icon--danger" aria-hidden="true">
            <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
          </span>
          Sign out
        </button>
      </form>
    </nav>

    <p class="portal-footer__copy">
      <span class="portal-footer__copy-icon" aria-hidden="true">©</span>
      {% now "Y" %} {{ brand.school_name }}
    </p>
  </div>
</footer>
